spring.application.name=MercoHuevos-Backend

spring.datasource.url=jdbc:mysql://localhost:3306/mercohuevos_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql}

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ddl-auto: usa 'update' para que Spring cree las tablas automaticamente basadas en tus @Entity
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola (super util para desarrollo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true